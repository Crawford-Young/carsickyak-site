onlyBuiltDependencies:
  - '@sentry/cli'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - sharp
ignoredBuiltDependencies:
  - unrs-resolver
overrides:
  # GHSA-mrhx-c7xc-m3w5: keep a single patched zod 4 across t3-env.
  zod: 4.6.7
  # Exact pins for high-sev transitive advisories via next (GHSA-f88m-g3jw-g9cj,
  # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849). Remove when next's ranges catch up.
  postcss: 8.5.23
  sharp: 0.35.5
  # Transitive via @sentry/nextjs > webpack > minimizer-webpack-plugin: fast-uri
  # (GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp, GHSA-qw65-cvwx-89v3) and nanoid (GHSA-2v37-7h3g-55p8).
  # Remove when the webpack chain resolves patched versions on its own.
  fast-uri: 3.1.9
  nanoid: 3.3.20
minimumReleaseAgeExclude:
  - '@crawfordyoung/ui@0.29.0'
auditConfig:
  # GHSA-mh99-v99m-4gvg: brace-expansion <=5.0.7 DoS (OOM), only patched in
  # 5.0.8 — no 1.x backport. Our vulnerable copy (1.1.16) is dev-only
  # (eslint -> minimatch@3), which requires brace-expansion as a CJS default
  # function; 5.x exports named `expand`, so overriding breaks eslint.
  # `pnpm audit --prod --audit-level=high` is clean. Remove once a 1.x
  # backport ships or the eslint chain moves off minimatch@3.
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
